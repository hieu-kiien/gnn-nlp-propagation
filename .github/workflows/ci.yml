name: CI Verification

on:
  push:
    branches: [main, 'results/**']
  pull_request:
    branches: [main, 'results/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Forbidden Binary, Dataset & Secret File Gate
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(\.(pt|pth|ckpt|bin|safetensors|parquet|zip|secret|jsonl|bak|docx)|\.tar(\.[[:alnum:]]+)?|_machine_key\.csv)$|(^|/)\.env(\.|$)|^runner_summary_.*\.json$|^paper/.*smoke|^(checkpoints|outputs)/' || true)
          forbidden_data=$(git ls-files 'data/raw/**' 'data/interim/**' 'data/processed/**' | grep -vE '(^|/)\.gitkeep$' || true)
          if [ -n "$forbidden" ] || [ -n "$forbidden_data" ]; then
            echo "ERROR: Forbidden tracked files detected in Git:"
            echo "$forbidden"
            echo "$forbidden_data"
            exit 1
          fi
          echo "Forbidden file gate passed cleanly."

      - name: Verify Paper LaTeX Underscore Escaping
        run: |
          python -c "import pathlib, sys; from scripts.assemble_paper_artifacts import find_unescaped_underscores_in_latex; targets = sorted(pathlib.Path('paper').glob('tables_*.tex')) + ([pathlib.Path('paper/main.tex')] if pathlib.Path('paper/main.tex').is_file() else []); issues = {str(p): find_unescaped_underscores_in_latex(p.read_text(encoding='utf-8')) for p in targets}; issues = {k: v for k, v in issues.items() if v}; print('LaTeX issues:', issues); sys.exit(1 if issues else 0)"

      - name: Install CPU PyTorch and Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          pip install -r requirements.txt

      - name: Run Full Pytest Suite
        run: |
          python -m pytest -q

      - name: Run Offline Research & Safeguard Smoke Checks
        run: |
          python -m scripts.demo_research_walkthrough
          python -m scripts.predict_live_thread --demo-offline
          python -m scripts.kaggle_parallel_runner --role member1_vn --smoke-test
          python -m scripts.run_macro_signed_network --smoke-test

name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Forbidden Binary, Dataset & Secret File Gate
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(\.(pt|pth|ckpt|bin|safetensors|parquet|zip|secret)|\.tar(\.[[:alnum:]]+)?|_machine_key\.csv)$|^paper/.*smoke' || true)
          if [ -n "$forbidden" ]; then
            echo "ERROR: Forbidden tracked files detected in Git:"
            echo "$forbidden"
            exit 1
          fi
          echo "Forbidden file gate passed cleanly."

      - name: Install CPU PyTorch and Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3.0"
          pip install -r requirements.txt

      - name: Run Full Pytest Suite
        run: |
          python -m pytest -q

      - name: Run Offline Research & Safeguard Smoke Checks
        run: |
          python -m scripts.demo_research_walkthrough
          python -m scripts.predict_live_thread --demo-offline
          python -m scripts.kaggle_parallel_runner --role member1_vn --smoke-test
